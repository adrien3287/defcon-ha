  - title: Contexte
    path: contexte
    icon: mdi:newspaper-variant-multiple
    type: masonry
    cards:
      - type: entities
        title: Contexte RSS / Gemini
        state_color: true
        show_header_toggle: false
        entities:
          - entity: sensor.defcon_home_lagezentrum_news_context
            name: Dernière information pertinente
            icon: mdi:newspaper-variant-multiple

      - type: markdown
        title: Analyse
        entity_id:
          - sensor.defcon_home_lagezentrum_news_context
        content: |
          {% set e = 'sensor.defcon_home_lagezentrum_news_context' %}
          {% set imp = state_attr(e, 'importance') | int(0) %}
          {% set protective = state_attr(e, 'protective_action') | default(false, true) %}
          {% set title = state_attr(e, 'title') | default('', true) %}
          {% set summary = state_attr(e, 'summary_fr') | default('', true) %}
          {% set reason = state_attr(e, 'reason') | default('', true) %}
          {% set action = state_attr(e, 'recommended_action') | default('aucune', true) %}
          {% set category = state_attr(e, 'category') | default('other', true) %}
          {% set scope = state_attr(e, 'scope') | default('', true) %}
          {% set link = state_attr(e, 'link') | default('', true) %}
          {% set analyzed = state_attr(e, 'analyzed_at') | default('', true) %}

          {% if states(e) == 'idle' %}
          <ha-alert alert-type="info">Aucune information RSS pertinente analysée pour le moment.</ha-alert>
          {% elif imp >= 3 %}
          <ha-alert alert-type="error">
          <b>IMPORTANT{% if protective %} — CONSIGNE DE PROTECTION{% endif %}</b>
          </ha-alert>
          {% elif imp == 2 %}
          <ha-alert alert-type="warning"><b>À SURVEILLER</b></ha-alert>
          {% else %}
          <ha-alert alert-type="info"><b>INFORMATION</b></ha-alert>
          {% endif %}

          {% if title %}
          ## {{ title }}

          **Résumé :** {{ summary }}

          **Catégorie :** {{ category }}  
          **Portée :** {{ scope }}  
          **Importance :** {{ imp }}/3  
          **Consigne de protection :** {{ 'Oui' if protective else 'Non' }}

          **Pourquoi c'est pertinent :**  
          {{ reason }}

          {% if action and action != 'aucune' %}
          ### Action recommandée
          {{ action }}
          {% endif %}

          {% if link %}
          [Ouvrir l'article source]({{ link }})
          {% endif %}

          {% if analyzed %}
          _Analyse : {{ analyzed }}_
          {% endif %}
          {% endif %}

      - type: markdown
        title: Principe
        content: >-
          Le contexte RSS est analysé par Gemini pour filtrer, traduire et
          résumer les informations pertinentes. Cette couche reste informative :
          elle ne modifie pas directement le niveau DEFCON.
