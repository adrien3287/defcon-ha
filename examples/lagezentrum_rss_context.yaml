# Lagezentrum RSS context automation for Home Assistant.
#
# Prerequisite:
#   AI Task entity: ai_task.google_ai_task
#
# Add these Feedreader integrations in Home Assistant:
#   https://www.ndr.de/nachrichten/hamburg/index~rss2.xml
#   https://www.presseportal.de/rss/dienststelle_6337.rss2
#   https://www.presseportal.de/rss/dienststelle_82522.rss2
#   https://www.tagesschau.de/inland/regional/hamburg/index~rss2.xml
#
# The automation emits "lagezentrum_rss_analyzed".
# DEFCON Home stores the latest relevant item in:
#   sensor.lagezentrum_news_context
#
# RSS/AI context is informational only and does NOT modify DEFCON.

automation:
  - alias: "Lagezentrum - Analyse RSS Gemini"
    id: lagezentrum_analyse_rss_gemini
    mode: queued
    max: 20

    triggers:
      - trigger: event
        event_type: feedreader

    actions:
      - action: ai_task.generate_data
        data:
          entity_id: ai_task.google_ai_task
          task_name: "Lagezentrum RSS"
          instructions: >-
            Tu analyses une information pour un centre de situation domestique
            situé à Hamburg-Marmstorf.

            ARTICLE À ANALYSER

            Titre:
            {{ trigger.event.data.title | default('') }}

            Description:
            {{ trigger.event.data.description | default('') }}

            Contenu:
            {{ trigger.event.data.content | default('') }}

            Source:
            {{ trigger.event.data.feed_url | default('') }}

            Lien:
            {{ trigger.event.data.link | default('') }}

            Analyse uniquement l'impact pratique potentiel pour une famille
            vivant à Hamburg-Marmstorf.

            Importance:
            0 = sans intérêt pratique
            1 = information utile mais sans action
            2 = situation à surveiller, sans consigne de protection immédiate
            3 = événement important avec consigne officielle de protection,
                impact direct potentiel sur l'habitation ou nécessité d'une action immédiate

            Si l'article contient une consigne explicite adressée à la population
            comme fermer fenêtres/portes, couper la ventilation, éviter une zone,
            ne pas boire l'eau, évacuer ou se mettre à l'abri,
            alors importance doit être 3.

            Catégories autorisées:
            security, fire, infrastructure, electricity, water, telecom,
            transport, weather, pollution, supply, other

            Utilise la cause principale comme catégorie.
            Exemples:
            - incendie avec fumées -> fire
            - pollution sans incendie -> pollution
            - panne électrique -> electricity
            - rupture ou contamination d'eau -> water
            - panne Internet/mobile -> telecom
            - perturbation ferroviaire majeure -> transport

            Portée:
            local, hamburg, germany, europe, world

            Règle géographique stricte:
            Ne jamais élargir la zone concernée au-delà de ce qui est explicitement
            indiqué dans l'article.
            Si l'article dit seulement "plusieurs quartiers", ne suppose pas que
            toute la ville de Hambourg est concernée.
            Si Hamburg-Marmstorf n'est pas explicitement cité, indique clairement
            que l'impact sur Marmstorf est potentiel ou inconnu.
            Ne confonds pas "événement situé à Hambourg" avec
            "événement affectant tout Hambourg".

            Sois conservateur.
            Un fait divers ordinaire, le sport, la culture, une information
            politique sans conséquence opérationnelle immédiate ou un simple
            retard isolé doivent être non pertinents ou avoir une importance 0.

            Ne déduis aucun fait absent du texte.
            Résume en français en maximum deux phrases.

          structure:
            relevant:
              description: "Pertinent pour le Lagezentrum"
              required: true
              selector:
                boolean:
            importance:
              description: "Importance opérationnelle de 0 à 3"
              required: true
              selector:
                number:
                  min: 0
                  max: 3
            category:
              description: "Catégorie opérationnelle"
              required: true
              selector:
                text:
            scope:
              description: "Portée géographique"
              required: true
              selector:
                text:
            protective_action:
              description: "Une consigne officielle de protection est-elle présente ?"
              required: true
              selector:
                boolean:
            summary_fr:
              description: "Résumé factuel en français, maximum deux phrases"
              required: true
              selector:
                text:
            reason:
              description: "Pourquoi l'information est pertinente ou non"
              required: true
              selector:
                text:
            recommended_action:
              description: "Action pratique éventuelle, sinon 'aucune'"
              required: true
              selector:
                text:
        response_variable: rss_result

      - event: lagezentrum_rss_analyzed
        event_data:
          title: "{{ trigger.event.data.title | default('') }}"
          link: "{{ trigger.event.data.link | default('') }}"
          feed_url: "{{ trigger.event.data.feed_url | default('') }}"
          relevant: "{{ rss_result.data.relevant | default(false) }}"
          importance: "{{ rss_result.data.importance | default(0) }}"
          category: "{{ rss_result.data.category | default('other') }}"
          scope: "{{ rss_result.data.scope | default('') }}"
          protective_action: "{{ rss_result.data.protective_action | default(false) }}"
          summary_fr: "{{ rss_result.data.summary_fr | default('') }}"
          reason: "{{ rss_result.data.reason | default('') }}"
          recommended_action: "{{ rss_result.data.recommended_action | default('aucune') }}"
