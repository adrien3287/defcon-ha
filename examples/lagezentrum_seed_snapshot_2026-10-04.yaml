# DEFCON Home - snapshot RSS courant au 04.10.2026
#
# Ce script rejoue un instantane des articles actuellement exposes par les
# 13 sources du Lagezentrum. Il est destine a etre lance UNE FOIS pour
# amorcer le contexte apres l'installation des Feedreader.
#
# IMPORTANT:
# - l'automation Lagezentrum RSS/Gemini v0.4 doit etre activee;
# - chaque item est rejoue comme un evenement "feedreader";
# - le delai de 6 s limite la pression sur la file Gemini;
# - les liens pointent vers l'article source exact lorsqu'il a pu etre verifie;
# - un lien reste vide uniquement si aucun article exact n'a pu etre resolu,
#   afin d'eviter de fusionner a tort plusieurs evenements.
#
# Snapshot compile depuis les pages publiques vivantes correspondant aux
# flux; les endpoints XML RSS eux-memes ne sont pas lisibles par le navigateur
# de recherche utilise pour cette generation.
#
alias: "Lagezentrum - Seed snapshot RSS 2026-10-04"
description: >-
  Rejoue 107 articles/points d'information courants issus des
  13 sources Lagezentrum pour amorcer immediatement l'analyse Gemini.
mode: single

